<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BARBER-A DOMINICANA | Barbería</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background: #0b0b0b;
      color: #f5f5f5;
      line-height: 1.6;
    }

    /* ENCABEZADO */

    header {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      background:
        linear-gradient(rgba(0,0,0,0.72), rgba(0,0,0,0.9)),
        radial-gradient(circle at center, #444 0%, #111 45%, #000 100%);
      border-bottom: 1px solid #555;
    }

    .hero {
      max-width: 850px;
    }

    .small-title {
      letter-spacing: 6px;
      font-size: 14px;
      color: #aaa;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    h1 {
      font-family: Arial, sans-serif;
      font-size: clamp(42px, 9vw, 90px);
      letter-spacing: 5px;
      line-height: 1;
      margin-bottom: 25px;
      color: white;
      font-weight: 900;
    }

    .hero p {
      font-size: clamp(18px, 3vw, 25px);
      color: #d0d0d0;
      margin-bottom: 35px;
    }

    .boton {
      display: inline-block;
      padding: 15px 32px;
      border: 1px solid white;
      color: white;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-family: Arial, sans-serif;
      font-weight: bold;
      transition: 0.3s;
    }

    .boton:hover {
      background: white;
      color: black;
    }

    /* SECCIONES */

    section {
      padding: 80px 20px;
      max-width: 1100px;
      margin: auto;
    }

    .titulo-seccion {
      text-align: center;
      margin-bottom: 50px;
    }

    .titulo-seccion h2 {
      font-family: Arial, sans-serif;
      font-size: clamp(30px, 5vw, 48px);
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 12px;
    }

    .linea {
      width: 70px;
      height: 2px;
      background: white;
      margin: auto;
    }

    /* SERVICIOS */

    .servicios {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
    }

    .servicio {
      background: #151515;
      border: 1px solid #3a3a3a;
      padding: 35px 25px;
      text-align: center;
      transition: 0.3s;
    }

    .servicio:hover {
      transform: translateY(-8px);
      border-color: white;
    }

    .numero {
      font-size: 14px;
      color: #888;
      letter-spacing: 3px;
      margin-bottom: 15px;
    }

    .servicio h3 {
      font-family: Arial, sans-serif;
      font-size: 27px;
      margin-bottom: 15px;
      text-transform: uppercase;
    }

    .precio {
      font-family: Arial, sans-serif;
      font-size: 28px;
      font-weight: bold;
      margin-top: 20px;
    }

    .descripcion {
      color: #aaa;
      font-size: 16px;
    }

    /* GALERÍA */

    .galeria {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .foto {
      height: 330px;
      background:
        linear-gradient(135deg, #292929, #090909);
      border: 1px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      color: #aaa;
      font-family: Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    /* INFORMACIÓN */

    .informacion {
      background: #f2f2f2;
      color: #111;
      max-width: none;
      text-align: center;
    }

    .informacion-contenido {
      max-width: 900px;
      margin: auto;
    }

    .dato {
      margin: 25px 0;
    }

    .dato h3 {
      font-family: Arial, sans-serif;
      text-transform: uppercase;
      font-size: 15px;
      letter-spacing: 3px;
      margin-bottom: 5px;
    }

    .dato p {
      font-size: 22px;
    }
